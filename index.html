<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC10 • GET KEY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d12; color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .container {
    background: #0e1118; border: 1px solid #1e2430;
    border-radius: 20px; padding: 40px 28px;
    max-width: 440px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { font-size: 48px; margin-bottom: 12px; }
  h1 { color: #00e5ff; font-size: 24px; letter-spacing: 2px; margin-bottom: 6px; }
  .subtitle { color: #5a6478; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 30px; }
  .steps { background: #141821; border-radius: 12px; padding: 18px; margin-bottom: 24px; text-align: left; border: 1px solid #1e2430; }
  .steps p { color: #8a92a6; font-size: 13px; margin: 6px 0; }
  .steps p span { color: #00e5ff; font-weight: bold; }
  .btn {
    background: linear-gradient(135deg, #00e5ff 0%, #00b8cc 100%);
    color: #0b0d12; border: none; padding: 16px 40px;
    font-size: 16px; font-weight: bold; border-radius: 10px;
    cursor: pointer; width: 100%; letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(0,229,255,0.3);
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; }
  .key-display {
    background: #0b0d12; border: 1px solid #1e2430; border-radius: 10px;
    padding: 22px 16px; margin-top: 22px; min-height: 32px;
    font-family: 'Courier New', monospace; font-size: 17px;
    color: #00e5ff; letter-spacing: 1.5px; word-break: break-all;
    display: none; font-weight: bold;
  }
  .key-display.show { display: block; }
  .copy-btn {
    background: #1e2430; color: #00e5ff; font-size: 13px;
    padding: 12px 24px; margin-top: 12px;
    border: 1px solid #2a3448; border-radius: 8px;
    cursor: pointer; display: none; font-weight: bold;
  }
  .copy-btn.show { display: inline-block; }
  .status { color: #ffb800; font-size: 13px; margin-top: 16px; min-height: 20px; }
  .status.ok { color: #39ff88; }
  .status.err { color: #ff3c55; }
  .footer { color: #3a4050; font-size: 11px; margin-top: 28px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">🎭</div>
    <h1>LC10 • TANK</h1>
    <div class="subtitle">Sistema de Licença</div>

    <div class="steps">
      <p><span>1.</span> Clique em "Pegar Key"</p>
      <p><span>2.</span> Copie a key gerada</p>
      <p><span>3.</span> Cole no painel do script</p>
    </div>

    <button class="btn" id="getBtn" onclick="getKey()">🔑 PEGAR KEY</button>
    <div class="key-display" id="keyDisplay"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 COPIAR KEY</button>
    <div class="status" id="status"></div>
    <div class="footer">v1.0 · LC10 SYSTEM</div>
  </div>

  <script>
    const GITHUB_API = "https://api.github.com/repos/lc10lfb-byte/lc10/contents/keys.txt";
    let currentKey = "";

    async function getKey() {
      const btn = document.getElementById("getBtn");
      const display = document.getElementById("keyDisplay");
      const copyBtn = document.getElementById("copyBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "⏳ Carregando...";
      display.classList.remove("show");
      copyBtn.classList.remove("show");
      status.className = "status";
      status.textContent = "";

      try {
        const res = await fetch(GITHUB_API + "?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        const b64 = data.content.replace(/\n/g, "");
        const text = atob(b64);

        const keys = text.split(/\r?\n/).map(k => k.trim()).filter(k => k.length > 5);

        if (keys.length === 0) {
          status.className = "status err";
          status.textContent = "❌ Nenhuma key disponível";
          return;
        }

        currentKey = keys[Math.floor(Math.random() * keys.length)];
        display.textContent = currentKey;
        display.classList.add("show");
        copyBtn.classList.add("show");
        status.className = "status ok";
        status.textContent = "✅ Key gerada! Copie e cole no painel";

      } catch (e) {
        status.className = "status err";
        status.textContent = "❌ Erro: " + e.message;
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = "🔑 PEGAR KEY";
      }
    }

    function copyKey() {
      if (!currentKey) return;
      const status = document.getElementById("status");
      navigator.clipboard.writeText(currentKey).then(() => {
        status.className = "status ok";
        status.textContent = "📋 Key copiada!";
        setTimeout(() => { status.textContent = "✅ Cole no painel do script"; }, 1500);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = currentKey;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        status.className = "status ok";
        status.textContent = "📋 Key copiada!";
      });
    }
  </script>
</body>
</html>
